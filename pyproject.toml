[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "index-guard"
version = "0.1.0"
description = "Audit Git index paths against ignore rules without reading file contents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "erburenwang" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
index-guard = "index_guard.cli:main"

[project.urls]
Repository = "https://github.com/erburenwang/index-guard"
Issues = "https://github.com/erburenwang/index-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]
