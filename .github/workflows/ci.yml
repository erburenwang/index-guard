name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run unit and Git integration tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Install package without runtime dependencies
        run: python -m pip install --no-deps .

      - name: Check installed CLI help
        run: index-guard --help

      - name: Validate installed CLI JSON output
        run: python -c "import json, subprocess; report=json.loads(subprocess.check_output(['index-guard','audit','--scope','tracked','--format','json'], text=True)); assert report['findings']==[]"
